# Deployment for your team VM: Caddy terminates TLS on your public hostname and
# reverse-proxies to your app over the compose network.
#
#   docker compose up -d --build
#
# `app` is deliberately NOT published to the host. Only Caddy is reachable from
# outside, on 80 and 443, and it reaches your application as `app:8080` on the
# internal network. Your app must therefore bind 0.0.0.0 inside the container,
# which the template already does.

services:
  proxy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/tls/llmhack/fullchain.pem:/etc/caddy/certs/fullchain.pem:ro
      - /etc/tls/llmhack/privkey.pem:/etc/caddy/certs/privkey.pem:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Inference credentials. Copy inference.env.example to inference.env first,
    # or compose will refuse to start.
    env_file:
      - inference.env
    # The track data. Unzip it into ./corpus, which is mounted read-only at the
    # same path inside the container. To keep it elsewhere on the VM, point
    # CORPUS_DIR at that directory:  CORPUS_DIR=/opt/track2_data docker compose up -d
    volumes:
      - ${CORPUS_DIR:-./corpus}:/corpus:ro
      - ${OUTPUT_DIR:-./output}:/output
      - ${DATA_DIR:-./data}:/data:ro
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8080"
    # Advisory only: Caddy does not wait on this, so removing /health will not
    # stop you being proxied. It makes `docker compose ps` show whether your app
    # actually came up.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
        restart: true

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - 127.0.0.1:6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  qdrant_storage:
  hf_cache:
