[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.127.0",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-ai>=2.43.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.19.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]
